<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610">
<rect width="1200" height="610" fill="#f4f7fb"/>
<g font-family="Segoe UI, sans-serif" fill="#172a42">
<text x="30" y="40" font-size="25">ЛР3 · День 3 · S-04 завершена після додаткових 2 одиниць</text>
<text x="30" y="70" font-size="16">Остаточний потік S-04 замінює початкове припущення дня 2.</text>
<text x="30" y="110" font-size="21" font-weight="bold">S-04 · Остаточний потік: два режими і перехід</text>
<rect x="30" y="128" width="350" height="172" rx="12" fill="white" stroke="#9bb0ca"/>
<text x="46" y="160" font-size="17" font-weight="bold">1. Режим: ЧЕРНЕТКА</text>
<text x="46" y="194" font-size="15">Новий опис кафедри</text>
<text x="46" y="221" font-size="15">[ Переглянути опубліковане ]</text>
<text x="46" y="248" font-size="15">[ Опублікувати ]</text>
<text x="390" y="215" font-size="27">→</text>
<rect x="425" y="128" width="350" height="172" rx="12" fill="white" stroke="#9bb0ca"/>
<text x="441" y="160" font-size="17" font-weight="bold">2. Режим: ОПУБЛІКОВАНО</text>
<text x="441" y="194" font-size="15">Старий опис кафедри</text>
<text x="441" y="221" font-size="15">[ Повернутися до чернетки ]</text>
<text x="441" y="248" font-size="15">Перемикання не публікує змін</text>
<text x="785" y="215" font-size="27">→</text>
<rect x="820" y="128" width="350" height="172" rx="12" fill="white" stroke="#9bb0ca"/>
<text x="836" y="160" font-size="17" font-weight="bold">3. Повернутись і опублікувати</text>
<text x="836" y="194" font-size="15">Чернетка → підтвердити</text>
<text x="836" y="221" font-size="15">Публічна версія: Новий опис</text>
<text x="836" y="248" font-size="15">Режими тепер узгоджені</text>
<text x="30" y="350" font-size="21" font-weight="bold">S-11 · Меню без розробника</text>
<rect x="30" y="368" width="350" height="172" rx="12" fill="white" stroke="#9bb0ca"/>
<text x="46" y="400" font-size="17" font-weight="bold">1. Структура меню</text>
<text x="46" y="434" font-size="15">Про кафедру</text>
<text x="46" y="461" font-size="15">Контакти</text>
<text x="46" y="488" font-size="15">[ Додати розділ ]</text>
<text x="390" y="455" font-size="27">→</text>
<rect x="425" y="368" width="350" height="172" rx="12" fill="white" stroke="#9bb0ca"/>
<text x="441" y="400" font-size="17" font-weight="bold">2. Змінити порядок</text>
<text x="441" y="434" font-size="15">Назва: Викладачі</text>
<text x="441" y="461" font-size="15">Позиція: після Про кафедру</text>
<text x="441" y="488" font-size="15">[ Зберегти ]</text>
<text x="785" y="455" font-size="27">→</text>
<rect x="820" y="368" width="350" height="172" rx="12" fill="white" stroke="#9bb0ca"/>
<text x="836" y="400" font-size="17" font-weight="bold">3. Меню сайту</text>
<text x="836" y="434" font-size="15">Про кафедру</text>
<text x="836" y="461" font-size="15">Викладачі</text>
<text x="836" y="488" font-size="15">Контакти</text>
</g></svg>